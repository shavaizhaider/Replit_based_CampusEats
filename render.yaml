services:
  - type: web
    name: campusbite
    runtime: python
    rootDir: artifacts/campusbite
    buildCommand: pip install -r requirements.txt && python scripts/init_db.py && python scripts/seed_data.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: CAMPUSBITE_INIT_DB
        value: "1"
      - key: CAMPUSBITE_DEMO_DATA
        value: "1"
